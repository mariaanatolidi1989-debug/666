
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft: Математична пригода</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #fff;
  background: #263b2b;
  background-image:
    linear-gradient(45deg,#314d35 25%,transparent 25%),
    linear-gradient(-45deg,#314d35 25%,transparent 25%);
  background-size: 40px 40px;
}

header {
  text-align: center;
  padding: 24px 12px;
  background: #386b32;
  border-bottom: 7px solid #234522;
}

h1 { margin: 0; font-size: clamp(23px,5vw,38px); }
header p { margin-bottom: 0; }

.container {
  max-width: 950px;
  margin: auto;
  padding: 18px;
}

.progress {
  background: #172719;
  height: 17px;
  border: 3px solid #111;
  margin: 15px 0;
}

#progressBar {
  width: 0%;
  height: 100%;
  background: #8bd34b;
  transition: width .3s;
}

.stations {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(130px,1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.station {
  padding: 13px 7px;
  background: #657d45;
  border: 4px solid #273c22;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

.station.active { background: #d29b38; color: #222; }
.station.completed { background: #318a49; }

.panel {
  background: #e6e6d2;
  color: #222;
  border: 6px solid #5a452b;
  padding: 20px;
  box-shadow: 0 8px 0 #172719;
}

.rule {
  background: #fff0b5;
  border: 4px solid #c38b24;
  padding: 15px;
  margin: 15px 0;
  color: #35290d;
  line-height: 1.5;
}

.rule h3 { margin: 0 0 8px; }

.question {
  background: white;
  border: 3px solid #888;
  padding: 18px;
  margin: 15px 0;
  text-align: center;
  font-size: 23px;
  font-weight: bold;
}

.answers {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(110px,1fr));
  gap: 12px;
}

.answer {
  background: #4b7840;
  border: 4px solid #294c26;
  color: white;
  padding: 14px;
  cursor: pointer;
  font-size: 20px;
  font-weight: bold;
  min-height: 65px;
}

.answer:hover { background: #6a9b4e; }
.answer:disabled { cursor: default; opacity: .8; }

.feedback {
  margin-top: 18px;
  padding: 15px;
  font-size: 17px;
  line-height: 1.6;
  display: none;
}

.correct { background: #c8edc3; border: 3px solid #398c3c; }
.wrong { background: #f5c8c8; border: 3px solid #b83c3c; }

button.next {
  display: block;
  margin: 20px auto 0;
  padding: 14px 25px;
  background: #d99b32;
  color: #222;
  border: 4px solid #80551c;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.fraction {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  line-height: 1.15;
  margin: 0 3px;
  font-size: .9em;
}

.fraction .top {
  border-bottom: 2px solid currentColor;
  padding: 1px 5px 3px;
}

.fraction .bottom { padding: 3px 5px 1px; }

.footer {
  text-align: center;
  padding: 25px;
  color: #e7eddb;
}

</style>
</head>
<body>

<header>
  <h1>⛏️ Minecraft: Математична пригода</h1>
  <p>Досліджуй світ дробів, проходь станції та здобувай блоки знань!</p>
</header>

<div class="container">

  <h3>🧭 Карта математичних станцій</h3>

  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <p id="score">⭐ Правильні відповіді: 0</p>

  <div class="stations" id="stations"></div>

  <div class="panel" id="game">
    <h2 id="stationTitle"></h2>

    <div class="rule">
      <h3>📘 Правило станції</h3>
      <div id="ruleText"></div>
    </div>

    <h3 id="taskNumber"></h3>
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>

    <button class="next" id="nextBtn" onclick="nextQuestion()" hidden>
      Наступне завдання ➜
    </button>
  </div>

</div>

<div class="footer">
  🏆 Кожна правильна відповідь наближає тебе до перемоги!
</div>

<script>

// Вертикальний запис звичайного дробу
function f(a,b) {
  return `<span class="fraction">
    <span class="top">${a}</span>
    <span class="bottom">${b}</span>
  </span>`;
}

// Математичні станції
const stations = [
{
 name:"🟩 Множення дробів",
 rule:"Щоб перемножити дроби, потрібно перемножити чисельники між собою, а знаменники — між собою. За можливості скороти результат.",
 tasks:[
  {q:`${f(2,3)} · ${f(3,4)} = ?`,
   a:[f(1,2),f(2,7),f(3,4)],
   correct:0,
   explanation:`${f(2,3)} · ${f(3,4)} = ${f(6,12)} = ${f(1,2)}. Перемножили чисельники та знаменники.`},
  {q:`${f(3,5)} · ${f(2,3)} = ?`,
   a:[f(2,5),f(3,8),f(5,6)],
   correct:0,
   explanation:`${f(3,5)} · ${f(2,3)} = ${f(6,15)} = ${f(2,5)}.`}
 ]
},
{
 name:"🟦 Множення мішаних чисел",
 rule:"Спочатку перетвори мішані числа на неправильні дроби, а потім перемнож їх.",
 tasks:[
  {q:`1 ${f(1,2)} · 2 = ?`,
   a:[3,f(5,2),4],
   correct:0,
   explanation:`1 ${f(1,2)} = ${f(3,2)}. Тоді ${f(3,2)} · 2 = ${f(6,2)} = 3.`},
  {q:`2 ${f(1,3)} · 1 ${f(1,2)} = ?`,
   a:[3 ${f(1,2)},3,4],
   correct:0,
   explanation:`2 ${f(1,3)} = ${f(7,3)}, 1 ${f(1,2)} = ${f(3,2)}. Добуток дорівнює ${f(21,6)} = 3 ${f(1,2)}.`}
 ]
},
{
 name:"🟨 Ділення дробів",
 rule:"Щоб поділити один дріб на інший, потрібно перший дріб помножити на дріб, обернений до другого.",
 tasks:[
  {q:`${f(2,3)} : ${f(4,5)} = ?`,
   a:[f(5,6),f(2,5),f(8,15)],
   correct:0,
   explanation:`${f(2,3)} : ${f(4,5)} = ${f(2,3)} · ${f(5,4)} = ${f(10,12)} = ${f(5,6)}.`},
  {q:`${f(3,4)} : ${f(1,2)} = ?`,
   a:[1 ${f(1,2)},f(3,8),2],
   correct:0,
   explanation:`${f(3,4)} · ${f(2,1)} = ${f(6,4)} = 1 ${f(1,2)}.`}
 ]
},
{
 name:"🟧 Ділення мішаних чисел",
 rule:"Перетвори мішані числа на неправильні дроби, заміни ділення множенням на обернений дріб і виконай обчислення.",
 tasks:[
  {q:`1 ${f(1,2)} : ${f(1,2)} = ?`,
   a:[3,2,1],
   correct:0,
   explanation:`1 ${f(1,2)} = ${f(3,2)}. ${f(3,2)} : ${f(1,2)} = ${f(3,2)} · ${f(2,1)} = 3.`},
  {q:`2 : 1 ${f(1,3)} = ?`,
   a:[f(3,2),f(2,3),f(4,3)],
   correct:0,
   explanation:`1 ${f(1,3)} = ${f(4,3)}. 2 : ${f(4,3)} = 2 · ${f(3,4)} = ${f(3,2)}.`}
 ]
},
{
 name:"🟪 Дріб від числа",
 rule:"Щоб знайти дріб від числа, потрібно число помножити на цей дріб.",
 tasks:[
  {q:`Знайди ${f(2,3)} від 12.`,
   a:[8,6,9],
   correct:0,
   explanation:`12 · ${f(2,3)} = ${f(24,3)} = 8.`},
  {q:`Знайди ${f(3,4)} від 20.`,
   a:[15,12,16],
   correct:0,
   explanation:`20 · ${f(3,4)} = ${f(60,4)} = 15.`}
 ]
},
{
 name:"🟥 Число за його дробом",
 rule:"Щоб знайти число за значенням його дробу, потрібно дане значення поділити на цей дріб.",
 tasks:[
  {q:`Знайди число, якщо ${f(2,3)} його дорівнює 8.`,
   a:[12,10,16],
   correct:0,
   explanation:`8 : ${f(2,3)} = 8 · ${f(3,2)} = 12.`},
  {q:`Знайди число, якщо ${f(3,5)} його дорівнює 12.`,
   a:[20,15,18],
   correct:0,
   explanation:`12 : ${f(3,5)} = 12 · ${f(5,3)} = 20.`}
 ]
}
];

let stationIndex = 0;
let taskIndex = 0;
let score = 0;
let answered = false;
let completed = [];

function renderStations() {
 const el = document.getElementById("stations");
 el.innerHTML = "";

 stations.forEach((s,i)=>{
  const b = document.createElement("button");
  b.className = "station";
  if(i===stationIndex) b.classList.add("active");
  if(completed.includes(i)) b.classList.add("completed");
  b.textContent = s.name;
  b.onclick = ()=> {
   stationIndex=i;
   taskIndex=0;
   renderStations();
   renderGame();
  };
  el.appendChild(b);
 });
}

function renderGame() {
 const s = stations[stationIndex];
 const t = s.tasks[taskIndex];

 document.getElementById("stationTitle").textContent =
   s.name;

 document.getElementById("ruleText").textContent =
   s.rule;

 document.getElementById("taskNumber").textContent =
   `Завдання ${taskIndex+1} із ${s.tasks.length}`;

 document.getElementById("question").innerHTML = t.q;

 const answers = document.getElementById("answers");
 answers.innerHTML = "";

 t.a.forEach((a,i)=>{
  const b = document.createElement("button");
  b.className = "answer";
  b.innerHTML = a;
  b.onclick = ()=>checkAnswer(i,b);
  answers.appendChild(b);
 });

 const fb = document.getElementById("feedback");
 fb.style.display="none";
 fb.className="feedback";
 fb.innerHTML="";

 document.getElementById("nextBtn").hidden=true;
 answered=false;

 updateScore();
}

function checkAnswer(index,button) {
 if(answered) return;
 answered=true;

 const t = stations[stationIndex].tasks[taskIndex];
 const fb = document.getElementById("feedback");
 const buttons = document.querySelectorAll(".answer");

 buttons.forEach(b=>b.disabled=true);

 fb.style.display="block";

 if(index===t.correct) {
  score++;
  fb.className="feedback correct";
  fb.innerHTML="✅ Правильно! Чудова робота!<br><br>📖 Пояснення:<br>"+t.explanation;
 } else {
  fb.className="feedback wrong";
  fb.innerHTML="❌ Спробуй ще раз у наступному завданні.<br><br>Правильна відповідь: "+t.a[t.correct]+"<br><br>📖 Пояснення:<br>"+t.explanation;
 }

 updateScore();
 document.getElementById("nextBtn").hidden=false;
}

function nextQuestion() {
 const s=stations[stationIndex];

 if(taskIndex < s.tasks.length-1) {
  taskIndex++;
 } else {
  if(!completed.includes(stationIndex))
   completed.push(stationIndex);

  if(stationIndex < stations.length-1) {
   stationIndex++;
   taskIndex=0;
  } else {
   showFinish();
   return;
  }
 }

 renderStations();
 renderGame();
}

function updateScore() {
 document.getElementById("score").textContent=
  `⭐ Правильні відповіді: ${score}`;

 document.getElementById("progressBar").style.width=
  (completed.length/stations.length*100)+"%";
}

function showFinish() {
 document.getElementById("game").innerHTML=`
  <h2>🏆 Вітаємо! Пригоду завершено!</h2>
  <p>Ти пройшов усі математичні станції Minecraft!</p>
  <h2>⭐ Твій результат: ${score}</h2>
  <p>Продовжуй тренуватися та відкривати нові математичні світи!</p>
  <button class="next" onclick="location.reload()">
   🔄 Грати ще раз
  </button>
 `;
}

renderStations();
renderGame();

</script>
</body>
</html>
