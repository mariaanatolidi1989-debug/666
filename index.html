
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft: Математична пригода</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#243524;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:12px}
h1{color:#ffe477;margin:5px}
main{max-width:1000px;margin:auto;padding:10px}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.hud span{background:#426b35;padding:9px;border:2px solid #91b45b;border-radius:6px}
canvas{display:block;width:100%;height:auto;border:5px solid #754b28;background:#8bd0ed}
#hint{text-align:center;background:#304b2b;padding:10px}
.controls{display:flex;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap}
button{padding:11px 16px;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
.move{background:#d8e9b8;color:#243524}
.action{background:#f4c84d;color:#38290d}
button:disabled{opacity:.4}
#task{display:none;background:#f5edcf;color:#243524;padding:16px;border:4px solid #987044;border-radius:8px;margin-top:12px}
#task h2{color:#38612d}
.rule{background:#fff8dc;padding:12px;border-left:6px solid #e0ad32}
#question{font-size:21px;font-weight:bold;margin:16px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{background:white;border:2px solid #9caf85;color:#263b23}
.correct{background:#c9edb9!important}
.wrong{background:#f7c8bc!important}
#feedback{font-weight:bold;margin:12px 0;min-height:25px}
#next{display:none;background:#477e37;color:white}
#close{background:#725a42;color:white}
#finish{display:none;background:#eaf2d7;color:#274122;padding:20px;text-align:center;margin-top:12px}
.fraction{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;line-height:1.05;margin:0 3px}
.fraction .top{border-bottom:2px solid currentColor;padding:0 5px 2px}
.fraction .bottom{padding:2px 5px 0}
@media(max-width:600px){.answers{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>⛏️ Minecraft: Математична пригода</h1>
<p>Подорожуй світом, виконуй завдання та збирай діаманти!</p>
</header>

<main>
<div class="hud">
<span>💎 Діаманти: <b id="score">0</b></span>
<span>📍 <b id="status">Початок пригоди</b></span>
</div>

<canvas id="game" width="1000" height="400"></canvas>
<div id="hint">Рух: ← → або A / D. Біля станції натисни E.</div>

<div class="controls">
<button class="move" id="left">◀ Ліворуч</button>
<button class="move" id="right">Праворуч ▶</button>
<button class="action" id="open" disabled>Відкрити станцію</button>
</div>

<section id="task">
<h2 id="taskTitle"></h2>
<div class="rule" id="rule"></div>
<div id="question"></div>
<div class="answers" id="answers"></div>
<div id="feedback"></div>
<button id="next">Наступне завдання</button>
<button id="close">Повернутися у світ</button>
</section>

<section id="finish">
<h2>🏆 Вітаємо! Пригоду завершено!</h2>
<p>Ти відвідав усі шість станцій і зібрав <b id="finalScore"></b> діамантів!</p>
<button class="action" onclick="location.reload()">Грати ще раз</button>
</section>
</main>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=1000, ground=320, world=1800;

function f(n,d){
 return `<span class="fraction"><span class="top">${n}</span><span class="bottom">${d}</span></span>`;
}
function m(w,n,d){return `${w}${f(n,d)}`;}

const stations=[
{
 name:"Множення звичайних дробів",x:150,color:"#428fca",
 rule:"Перемнож чисельники між собою, а знаменники — між собою. Скороти результат, якщо можна.",
 tasks:[
  {q:`${f(2,3)} · ${f(3,4)} = ?`,a:[f(1,2),f(2,7),f(5,7),f(3,4)],c:0,e:"2 · 3 = 6, 3 · 4 = 12. 6/12 = 1/2."},
  {q:`${f(3,5)} · ${f(5,6)} = ?`,a:[f(1,2),f(3,6),f(2,5),f(5,11)],c:0,e:"15/30 = 1/2."}
 ]
},
{
 name:"Множення мішаних чисел",x:440,color:"#9566c4",
 rule:"Перетвори мішані числа на неправильні дроби. Потім перемнож дроби.",
 tasks:[
  {q:`${m(1,1,2)} · ${m(1,1,3)} = ?`,a:["2",f(3,4),f(2,3),f(5,6)],c:0,e:"3/2 · 4/3 = 12/6 = 2."},
  {q:`${m(2,1,4)} · ${f(2,5)} = ?`,a:[f(1,2),f(9,10),f(3,5),f(4,5)],c:1,e:"9/4 · 2/5 = 18/20 = 9/10."}
 ]
},
{
 name:"Ділення звичайних дробів",x:730,color:"#d28a3e",
 rule:"Перший дріб помнож на дріб, обернений до другого.",
 tasks:[
  {q:`${f(2,3)} : ${f(4,5)} = ?`,a:[f(5,6),f(6,5),f(8,15),f(3,5)],c:0,e:"2/3 · 5/4 = 10/12 = 5/6."},
  {q:`${f(3,4)} : ${f(1,2)} = ?`,a:[f(3,8),f(2,3),f(3,2),f(1,4)],c:2,e:"3/4 · 2/1 = 6/4 = 3/2."}
 ]
},
{
 name:"Ділення мішаних чисел",x:1020,color:"#bd5961",
 rule:"Перетвори мішані числа на неправильні дроби. Ділення заміни множенням на обернений дріб.",
 tasks:[
  {q:`${m(1,1,2)} : ${m(1,1,4)} = ?`,a:[f(6,5),f(5,6),f(3,4),f(4,5)],c:0,e:"3/2 · 4/5 = 12/10 = 6/5."},
  {q:`2 : ${f(2,3)} = ?`,a:["3",f(3,2),f(2,3),f(4,3)],c:0,e:"2 · 3/2 = 3."}
 ]
},
{
 name:"Знаходження дробу від числа",x:1310,color:"#4caa75",
 rule:"Щоб знайти дріб від числа, помнож число на цей дріб.",
 tasks:[
  {q:`Знайди ${f(3,5)} від 20.`,a:["10","12","15","8"],c:1,e:"20 · 3/5 = 60/5 = 12."},
  {q:`Знайди ${f(2,3)} від 18.`,a:["9","10","12","14"],c:2,e:"18 · 2/3 = 36/3 = 12."}
 ]
},
{
 name:"Знаходження числа за значенням дробу",x:1600,color:"#d0a83d",
 rule:"Щоб знайти число, поділи дане значення на заданий дріб.",
 tasks:[
  {q:`${f(3,4)} числа дорівнює 12. Знайди число.`,a:["9","15","16","18"],c:2,e:"12 : 3/4 = 12 · 4/3 = 16."},
  {q:`${f(2,5)} числа дорівнює 8. Знайди число.`,a:["16","20","24","12"],c:1,e:"8 : 2/5 = 8 · 5/2 = 20."}
 ]
}
];

let playerX=30;
let camera=0;
let score=0;
let keys={};
let active=-1;
let taskIndex=0;
let answered=false;
let completed=new Set();

function block(x,y,size,color){
 ctx.fillStyle=color;ctx.fillRect(x,y,size,size);
 ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(x,y,size,4);
 ctx.fillRect(x,y,4,size);
 ctx.fillStyle="rgba(0,0,0,.18)";
 ctx.fillRect(x+size-4,y,4,size);
 ctx.fillRect(x,y+size-4,size,4);
}

function draw(){
 ctx.clearRect(0,0,W,400);
 ctx.fillStyle="#86cdeb";ctx.fillRect(0,0,W,400);

 // Хмари
 for(let i=0;i<5;i++){
  let x=(i*250-camera*.15)%(W+100);
  ctx.fillStyle="white";ctx.fillRect(x,55,65,18);
  ctx.fillRect(x+15,42,45,18);
 }

 // Пагорби
 for(let i=0;i<8;i++){
  let x=(i*260-camera*.2)%(W+260)-80;
  ctx.fillStyle="#77b76a";ctx.fillRect(x,210,180,110);
 }

 // Земля
 ctx.fillStyle="#80552e";ctx.fillRect(0,ground,W,80);
 for(let x=-camera%40;x<W;x+=40)block(x,ground,40,"#69a843");

 // Дерева
 [300,600,900,1200,1500,1750].forEach(wx=>{
  let x=wx-camera;
  if(x>-80&&x<W+80){
   ctx.fillStyle="#76502b";ctx.fillRect(x+15,250,18,70);
   block(x,205,48,"#39843c");
   block(x-12,225,30,"#39843c");
   block(x+30,225,30,"#39843c");
  }
 });

 // Станції
 stations.forEach((s,i)=>{
  let x=s.x-camera;
  block(x-25,268,50,s.color);
  ctx.fillStyle="#172817";ctx.font="bold 14px Arial";
  ctx.textAlign="center";ctx.fillText(i+1,x,250);
  ctx.fillStyle="white";ctx.font="bold 12px Arial";
  ctx.fillText(s.name,x,350);
  if(completed.has(i))ctx.fillText("💎",x,260);
 });

 // Персонаж
 let x=playerX-camera;
 block(x+5,playerY(),20,"#d8a06c");
 block(x+5,playerY()-3,20,"#593a25");
 ctx.fillStyle="#263b58";
 ctx.fillRect(x+9,playerY()+7,4,4);
 ctx.fillRect(x+19,playerY()+7,4,4);
 block(x+3,playerY()+20,24,"#2874a5");
 block(x+3,playerY()+40,10,14,"#334b86");
 block(x+17,playerY()+40,10,14,"#334b86");
 ctx.fillStyle="#d8a06c";
 ctx.fillRect(x,playerY()+22,5,15);
 ctx.fillRect(x+25,playerY()+22,5,15);

 let near=nearStation();
 if(near!==-1){
  ctx.strokeStyle="#fff36a";ctx.lineWidth=3;
  ctx.strokeRect(stations[near].x-camera-31,264,62,62);
 }
}
function playerY(){return ground-54;}

function nearStation(){
 let found=-1,dist=70;
 stations.forEach((s,i)=>{
  let d=Math.abs(playerX+15-s.x);
  if(d<dist&&!completed.has(i)){dist=d;found=i;}
 });
 return found;
}

function gameLoop(){
 if(document.getElementById("task").style.display!=="block"){
  if(keys.left)playerX-=4;
  if(keys.right)playerX+=4;
  playerX=Math.max(0,Math.min(world-30,playerX));
 }
 camera=Math.max(0,Math.min(world-W,playerX-350));
 draw();

 let near=nearStation();
 document.getElementById("open").disabled=near===-1;
 document.getElementById("status").textContent=
  near===-1?"Подорож світом":stations[near].name;
 document.getElementById("hint").textContent=
  near===-1?"Рухай персонажа. Підійди до кольорового блока станції. Натисни E.":
  "Ти біля станції «"+stations[near].name+"». Натисни E або кнопку нижче.";

 requestAnimationFrame(gameLoop);
}

function openStation(){
 let n=nearStation();
 if(n===-1)return;
 active=n;taskIndex=0;showTask();
}

function showTask(){
 let s=stations[active],t=s.tasks[taskIndex];
 document.getElementById("task").style.display="block";
 document.getElementById("taskTitle").textContent=
  "Станція "+(active+1)+": "+s.name;
 document.getElementById("rule").innerHTML="<b>Правило:</b> "+s.rule;
 document.getElementById("question").innerHTML=t.q;
 document.getElementById("feedback").textContent="";
 document.getElementById("next").style.display="none";
 document.getElementById("answers").innerHTML="";
 answered=false;

 t.a.forEach((a,i)=>{
  let b=document.createElement("button");
  b.className="answer";
  b.innerHTML=(i+1)+") "+a;
  b.onclick=()=>choose(i,b);
  document.getElementById("answers").appendChild(b);
 });
 document.getElementById("task").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function choose(i,button){
 if(answered)return;
 answered=true;
 let t=stations[active].tasks[taskIndex];
 let all=[...document.querySelectorAll(".answer")];
 all[t.c].classList.add("correct");

 if(i===t.c){
  score+=10;
  document.getElementById("score").textContent=score;
  document.getElementById("feedback").textContent=
   "✅ Правильно! +10 діамантів. "+t.e;
 }else{
  button.classList.add("wrong");
  document.getElementById("feedback").textContent=
   "Правильна відповідь підсвічена. "+t.e;
 }
 document.getElementById("next").style.display="inline-block";
 document.getElementById("next").textContent=
  taskIndex===stations[active].tasks.length-1?
  "Завершити станцію":"Наступне завдання";
}

document.getElementById("next").onclick=()=>{
 if(!answered)return;
 if(taskIndex<stations[active].tasks.length-1){
  taskIndex++;showTask();
 }else{
  completed.add(active);
  document.getElementById("task").style.display="none";
  active=-1;
  if(completed.size===stations.length){
   document.getElementById("finish").style.display="block";
   document.getElementById("finalScore").textContent=score;
  }
 }
};

document.getElementById("close").onclick=()=>{
 document.getElementById("task").style.display="none";
 active=-1;
};
document.getElementById("open").onclick=openStation;

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="ArrowRight")e.preventDefault();
 if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keys.right=true;
 if((e.key==="e"||e.key==="E")&&document.getElementById("task").style.display!=="block")openStation();
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keys.right=false;
});

function hold(id,direction){
 let b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[direction]=true;});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>
  b.addEventListener(ev,()=>keys[direction]=false));
}
hold("left","left");
hold("right","right");

gameLoop();
</script>
</body>
</html>
