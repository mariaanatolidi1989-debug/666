
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft — Математична пригода</title>

<style>
* { box-sizing:border-box; }

body {
 margin:0;
 font-family:Arial,sans-serif;
 background:#253c29;
 color:white;
}

header {
 text-align:center;
 padding:25px 10px;
 background:#477d38;
 border-bottom:8px solid #254b27;
}

header h1 {font-size:clamp(23px,5vw,36px);}

.container {max-width:950px;margin:auto;padding:18px;}

.stations {
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 margin:20px 0;
}

.station {
 padding:14px 5px;
 background:#587b43;
 color:white;
 border:4px solid #263e23;
 font-weight:bold;
 cursor:pointer;
}

.station.active {background:#e0a637;color:#222;}
.station.done {background:#268c49;}

.panel {
 background:#e9e9d9;
 color:#222;
 padding:20px;
 border:7px solid #79542f;
 box-shadow:0 8px 0 #142317;
}

.rule {
 background:#fff0b8;
 color:#342608;
 border:5px solid #d69c2c;
 padding:18px;
 margin:15px 0 22px;
 border-radius:5px;
}

.rule h3 {
 margin:0 0 12px;
 font-size:22px;
}

.rule p {
 margin:0;
 font-size:18px;
 line-height:1.55;
}

.rule .hint {
 margin-top:10px;
 font-weight:bold;
 color:#725016;
}

.question {
 background:white;
 border:3px solid #9b9b9b;
 padding:25px 10px;
 text-align:center;
 font-size:25px;
 margin:15px 0;
 min-height:90px;
}

.answers {
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
}

.answer {
 background:#4d8140;
 border:4px solid #294d27;
 color:white;
 padding:18px 8px;
 font-size:22px;
 cursor:pointer;
 min-height:75px;
}

.answer:disabled {opacity:.8;cursor:default;}

.feedback {
 display:none;
 margin-top:20px;
 padding:18px;
 font-size:18px;
 line-height:1.7;
}

.correct {background:#c9edc5;border:3px solid #348c3a;}
.wrong {background:#f5cccc;border:3px solid #b53c3c;}

.next {
 display:block;
 margin:20px auto 0;
 padding:15px 25px;
 background:#e4a432;
 border:4px solid #865b20;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}

.progress {
 height:17px;
 background:#111;
 border:3px solid #111;
 margin:15px 0;
}

#bar {height:100%;width:0;background:#8bda4e;}

.score {font-size:18px;}

.fraction {
 display:inline-flex;
 flex-direction:column;
 vertical-align:middle;
 text-align:center;
 align-items:stretch;
 line-height:1.05;
 margin:0 5px;
 font-size:0.95em;
 min-width:27px;
}

.numerator {
 display:block;
 padding:2px 5px 4px;
 border-bottom:2px solid currentColor;
}

.denominator {
 display:block;
 padding:4px 5px 2px;
}

.mixed {
 display:inline-flex;
 align-items:center;
 vertical-align:middle;
 gap:3px;
 white-space:nowrap;
}

.footer {text-align:center;padding:25px;}

@media(max-width:550px) {
 .stations {grid-template-columns:repeat(2,1fr);}
 .answers {grid-template-columns:repeat(2,1fr);}
 .panel {padding:12px;}
 .question {font-size:21px;}
}
</style>
</head>

<body>

<header>
<h1>⛏️ MINECRAFT: МАТЕМАТИЧНА ПРИГОДА</h1>
<p>Подорож світом звичайних дробів — 6 клас</p>
</header>

<div class="container">

<h3>🗺️ ОБЕРИ МАТЕМАТИЧНУ СТАНЦІЮ</h3>

<div class="progress"><div id="bar"></div></div>
<div class="score" id="score">⭐ Правильних відповідей: 0</div>

<div class="stations" id="stations"></div>

<div class="panel" id="game">

<h2 id="title"></h2>

<div class="rule">
<h3>📘 ПРАВИЛО СТАНЦІЇ</h3>
<p id="ruleText"></p>
<div class="hint" id="hint"></div>
</div>

<h3 id="number"></h3>

<div class="question" id="question"></div>

<div class="answers" id="answers"></div>

<div class="feedback" id="feedback"></div>

<button class="next" id="next" hidden onclick="nextTask()">
НАСТУПНЕ ЗАВДАННЯ ➜
</button>

</div>
</div>

<div class="footer">
🏆 Здобудь усі математичні досягнення Minecraft!
</div>

<script>

// ФОРМАТ ДРОБУ — ТІЛЬКИ ВЕРТИКАЛЬНИЙ
function F(a,b) {
 return `<span class="fraction">
 <span class="numerator">${a}</span>
 <span class="denominator">${b}</span>
 </span>`;
}

// МІШАНЕ ЧИСЛО
function M(w,a,b) {
 return `<span class="mixed">${w}${F(a,b)}</span>`;
}

function T(q,answers,right,explanation) {
 return {q,answers,right,explanation};
}

const data = [

{
 name:"🟩 Множення дробів",
 rule:"Щоб перемножити два звичайні дроби, потрібно перемножити чисельники між собою, а знаменники — між собою. За можливості скоротити результат.",
 hint:"Запам'ятай: чисельник · чисельник; знаменник · знаменник.",
 tasks:[
 T(
 `${F(2,3)} · ${F(3,4)} = ?`,
 [F(1,2),F(2,7),F(3,4)],
 0,
 `${F(2,3)} · ${F(3,4)} = ${F(6,12)} = ${F(1,2)}`
 ),
 T(
 `${F(3,5)} · ${F(2,3)} = ?`,
 [F(2,5),F(3,8),F(5,6)],
 0,
 `${F(3,5)} · ${F(2,3)} = ${F(6,15)} = ${F(2,5)}`
 )
 ]
},

{
 name:"🟦 Множення мішаних чисел",
 rule:"Перед множенням мішані числа потрібно перетворити на неправильні дроби. Потім перемножити чисельники та знаменники.",
 hint:"Запам'ятай: спочатку перетворюємо, потім множимо!",
 tasks:[
 T(
 `${M(1,1,2)} · 2 = ?`,
 [3,F(5,2),4],
 0,
 `${M(1,1,2)} = ${F(3,2)}. <br>
 ${F(3,2)} · 2 = ${F(6,2)} = 3`
 ),
 T(
 `${M(2,1,3)} · ${M(1,1,2)} = ?`,
 [M(3,1,2),3,4],
 0,
 `${M(2,1,3)} = ${F(7,3)}, 
 ${M(1,1,2)} = ${F(3,2)}. <br>
 ${F(7,3)} · ${F(3,2)} = ${F(21,6)} = ${M(3,1,2)}`
 )
 ]
},

{
 name:"🟨 Ділення дробів",
 rule:"Щоб поділити один звичайний дріб на інший, потрібно перший дріб помножити на дріб, обернений до другого.",
 hint:"Запам'ятай: ділення замінюємо множенням, другий дріб перевертаємо.",
 tasks:[
 T(
 `${F(2,3)} : ${F(4,5)} = ?`,
 [F(5,6),F(2,5),F(8,15)],
 0,
 `${F(2,3)} : ${F(4,5)} = ${F(2,3)} · ${F(5,4)} = ${F(10,12)} = ${F(5,6)}`
 ),
 T(
 `${F(3,4)} : ${F(1,2)} = ?`,
 [M(1,1,2),F(3,8),2],
 0,
 `${F(3,4)} : ${F(1,2)} = ${F(3,4)} · ${F(2,1)} = ${F(6,4)} = ${M(1,1,2)}`
 )
 ]
},

{
 name:"🟧 Ділення мішаних чисел",
 rule:"Мішані числа перетвори на неправильні дроби. Ділення заміни множенням на обернений дріб і виконай обчислення.",
 hint:"Запам'ятай: перетворити → перевернути другий дріб → помножити.",
 tasks:[
 T(
 `${M(1,1,2)} : ${F(1,2)} = ?`,
 [3,2,1],
 0,
 `${M(1,1,2)} = ${F(3,2)}. <br>
 ${F(3,2)} : ${F(1,2)} = ${F(3,2)} · ${F(2,1)} = 3`
 ),
 T(
 `2 : ${M(1,1,3)} = ?`,
 [F(3,2),F(2,3),F(4,3)],
 0,
 `${M(1,1,3)} = ${F(4,3)}. <br>
 2 : ${F(4,3)} = 2 · ${F(3,4)} = ${F(6,4)} = ${F(3,2)}`
 )
 ]
},

{
 name:"🟪 Знаходження дробу від числа",
 rule:"Щоб знайти дріб від числа, потрібно дане число помножити на цей дріб.",
 hint:"Запам'ятай: число · заданий дріб.",
 tasks:[
 T(
 `Знайди ${F(2,3)} від 12.`,
 [8,6,9],
 0,
 `12 · ${F(2,3)} = ${F(24,3)} = 8`
 ),
 T(
 `Знайди ${F(3,4)} від 20.`,
 [15,12,16],
 0,
 `20 · ${F(3,4)} = ${F(60,4)} = 15`
 )
 ]
},

{
 name:"🟥 Знаходження числа за дробом",
 rule:"Щоб знайти число за значенням його дробу, потрібно дане значення поділити на цей дріб.",
 hint:"Запам'ятай: значення дробу : заданий дріб.",
 tasks:[
 T(
 `Знайди число, якщо ${F(2,3)} його дорівнює 8.`,
 [12,10,16],
 0,
 `8 : ${F(2,3)} = 8 · ${F(3,2)} = 12`
 ),
 T(
 `Знайди число, якщо ${F(3,5)} його дорівнює 12.`,
 [20,15,18],
 0,
 `12 : ${F(3,5)} = 12 · ${F(5,3)} = 20`
 )
 ]
}

];

let station=0;
let task=0;
let score=0;
let completed=[];
let locked=false;

function renderStations() {
 const el=document.getElementById("stations");
 el.innerHTML="";

 data.forEach((s,i)=>{
  const b=document.createElement("button");
  b.className="station";
  if(i===station)b.classList.add("active");
  if(completed.includes(i))b.classList.add("done");
  b.textContent=s.name;
  b.onclick=()=>{
   station=i;
   task=0;
   render();
  };
  el.appendChild(b);
 });
}

function render() {
 const s=data[station];
 const t=s.tasks[task];

 document.getElementById("title").textContent=s.name;
 document.getElementById("ruleText").textContent=s.rule;
 document.getElementById("hint").textContent="💡 "+s.hint;

 document.getElementById("number").textContent=
 `ЗАВДАННЯ ${task+1} / ${s.tasks.length}`;

 document.getElementById("question").innerHTML=t.q;

 const el=document.getElementById("answers");
 el.innerHTML="";

 t.answers.forEach((a,i)=>{
  const b=document.createElement("button");
  b.className="answer";
  b.innerHTML=a;
  b.onclick=()=>check(i);
  el.appendChild(b);
 });

 const fb=document.getElementById("feedback");
 fb.style.display="none";
 fb.className="feedback";
 fb.innerHTML="";

 document.getElementById("next").hidden=true;

 locked=false;
 renderStations();
 updateScore();
}

function check(i) {
 if(locked)return;
 locked=true;

 const t=data[station].tasks[task];
 const fb=document.getElementById("feedback");
 const buttons=document.querySelectorAll(".answer");

 buttons.forEach(b=>b.disabled=true);

 fb.style.display="block";

 if(i===t.right) {
  score++;
  fb.className="feedback correct";
  fb.innerHTML=
  "✅ ПРАВИЛЬНО! Ти здобув математичний блок!<br><br>"+
  "📗 РОЗВ'ЯЗАННЯ:<br>"+t.explanation;
 } else {
  fb.className="feedback wrong";
  fb.innerHTML=
  "❌ Цього разу відповідь неправильна.<br><br>"+
  "Правильна відповідь: "+t.answers[t.right]+
  "<br><br>📗 РОЗВ'ЯЗАННЯ:<br>"+t.explanation;
 }

 document.getElementById("next").hidden=false;
 updateScore();
}

function nextTask() {
 if(task<data[station].tasks.length-1) {
  task++;
 } else {
  if(!completed.includes(station))completed.push(station);

  if(completed.length===data.length) {
   finish();
   return;
  }

  station=(station+1)%data.length;
  task=0;
 }

 render();
}

function updateScore() {
 document.getElementById("score").textContent=
 "⭐ Правильних відповідей: "+score;

 document.getElementById("bar").style.width=
 (completed.length/data.length*100)+"%";
}

function finish() {
 document.getElementById("game").innerHTML=`
 <h2>🏆 ВІТАЄМО, МАТЕМАТИЧНИЙ ГЕРОЮ!</h2>
 <p>Ти пройшов усі шість станцій Minecraft!</p>
 <h2>⭐ Твій результат: ${score}</h2>
 <p>Тепер світ звичайних дробів тобі під силу!</p>
 <button class="next" onclick="location.reload()">
 ГРАТИ ЩЕ РАЗ 🔄
 </button>`;
}

render();
</script>
</body>
</html>
